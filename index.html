<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lendara Shield: pagar en privado sin esconderse</title>
<meta name="description" content="Cómo funciona Lendara Shield, en dos minutos: pagos privados en Stellar que un auditor autorizado puede revisar. En español, inglés y portugués.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Lendara Shield: pagar en privado sin esconderse">
<meta property="og:description" content="Pagos privados en Stellar que un auditor autorizado puede revisar. ES · EN · PT.">
<meta property="og:image" content="https://lendara-org.github.io/shield-Interactive-explainer/docs/preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#20344D;--mut:#51647A;--line:#D9E2EC;--sub:#F5F8FC;--wh:#fff;--cr:#E22366;--wine:#C21852;--or:#FF8A3D;--co:#FF6255;--ap:#FFB36B;--pe:#FFE9D9;--soft:#FBE3ED;--ok:#75B52E;--okd:#2C4A12;--oks:#BBF87E;--info:#279EC5;--code:#EAF0F8;--err:#D94B3D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wh);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--wine)}
h1,h2,h3{font-family:Sora,Inter,sans-serif;font-weight:600;letter-spacing:-.035em}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--cr),var(--or));z-index:60}
.isotipo{fill:currentColor}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;gap:4vw;align-items:center;padding:8vh 6vw;position:relative;overflow:hidden}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:Sora,Inter,system-ui,sans-serif;font-weight:600;font-size:20px;color:var(--ink)}
.brand svg{height:26px;width:auto;color:var(--cr)}
.brand span{color:var(--mut);font-weight:600}
.kicker{font:500 12px/1 'Geist Mono',ui-monospace,monospace,monospace;letter-spacing:.16em;color:var(--cr);text-transform:uppercase;margin-top:44px}
.hero h1{font-size:clamp(42px,5.6vw,80px);line-height:1;margin:.3em 0 .35em;letter-spacing:-.045em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--cr),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.dek{font-size:clamp(18px,1.6vw,21px);line-height:1.55;color:var(--mut);max-width:560px;margin:0}
.tagline{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap}
.tagline b{font:500 13px 'Geist Mono',ui-monospace,monospace,monospace;background:var(--sub);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--ink)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.cta a{text-decoration:none;font:600 15px Inter,system-ui,sans-serif;border-radius:10px;padding:12px 18px;border:1px solid var(--line);color:var(--ink);background:#fff}
.cta a.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.langs{position:absolute;top:26px;right:6vw;z-index:5;display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 4px 14px #20344D10}
.langs button{border:0;background:transparent;font:500 12.5px 'Geist Mono',ui-monospace,monospace;color:var(--mut);padding:6px 10px;border-radius:7px;cursor:pointer;letter-spacing:.06em}
.langs button[aria-pressed=true]{background:var(--ink);color:#fff}
@media (max-width:980px){.langs{top:16px;right:16px}}
.mesh{position:relative;border-radius:32px;min-height:600px;display:flex;align-items:center;justify-content:center;padding:40px;overflow:hidden;isolation:isolate;background:var(--soft)}
.mesh::before,.mesh::after{content:"";position:absolute;inset:-30%;z-index:-1;background:radial-gradient(circle at 30% 30%,var(--pe),transparent 45%),radial-gradient(circle at 75% 25%,var(--ap),transparent 40%),radial-gradient(circle at 70% 80%,var(--cr),transparent 45%),radial-gradient(circle at 20% 85%,var(--co),transparent 40%);animation:drift 14s ease-in-out infinite alternate;filter:blur(20px)}
.mesh::after{animation-duration:19s;animation-direction:alternate-reverse;opacity:.55;mix-blend-mode:soft-light}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(6%,-4%) rotate(25deg)}}
.pay{width:100%;max-width:440px;background:#fff;border:1px solid #FFFFFFB3;border-radius:24px;padding:26px;box-shadow:0 24px 64px #20344D24}
.pay .top{display:flex;justify-content:space-between;align-items:center}
.pay .top small{font:500 11px 'Geist Mono',ui-monospace,monospace;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.pay h4{font-family:Sora,Inter,system-ui,sans-serif;font-size:22px;margin:22px 0 0;letter-spacing:-.025em}
.seg{display:flex;padding:4px;gap:4px;border-radius:10px;background:var(--sub);margin-top:18px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 10px;font:500 13px Inter,system-ui,sans-serif;color:var(--mut);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;transition:.2s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #20344D26}
.seg svg{width:15px;height:15px}
.pay dl{margin:18px 0 0;display:grid;gap:0}
.pay dl div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay dt{color:var(--mut)}.pay dd{margin:0;font-family:'Geist Mono',ui-monospace,monospace;font-size:13.5px}
.hs{position:relative;display:inline-block}
.hs .m,.hs .r{transition:opacity .35s,filter .35s}
.hs .r{position:absolute;right:0;top:0;white-space:nowrap;opacity:0;filter:blur(6px)}
.hs .m{display:inline-block;background:repeating-linear-gradient(90deg,var(--line) 0 7px,transparent 7px 10px);color:transparent;border-radius:4px;min-width:110px;text-align:right}
.aud .hs .m{opacity:0}.aud .hs .r{opacity:1;filter:none}
.note{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--mut)}
.note svg{width:16px;height:16px;color:var(--cr)}
.hint{position:absolute;bottom:3vh;left:6vw;font:500 11px 'Geist Mono',ui-monospace,monospace;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}

/* PROSE */
.prose{max-width:700px;margin:0 auto;padding:10vh 24px;font-size:19px;line-height:1.7;color:#33475F}
.prose p{margin:0 0 1.1em}
.prose .lead::first-letter{float:left;font-family:Sora,Inter,system-ui,sans-serif;font-size:4.1em;line-height:.85;padding:.06em .1em 0 0;font-weight:700;color:var(--cr)}
.prose h2{font-size:clamp(30px,3.4vw,42px);line-height:1.1;margin:0 0 .5em;color:var(--ink)}
.eyebrow{font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--cr);margin-bottom:10px}
code{font-family:'Geist Mono',ui-monospace,monospace,monospace;font-size:.84em;background:var(--code);color:var(--ink);padding:1px 6px;border-radius:5px}

/* SCROLLY */
.scrolly{position:relative;background:var(--sub)}
.stage{position:sticky;top:0;height:100vh;width:100%;overflow:hidden}
.gwrap{position:absolute;left:calc(6vw + 390px + 40px);right:40px;top:88px;bottom:5vh}
#g{width:100%;height:100%;display:block;overflow:visible}
.scene{opacity:0;transition:opacity .6s;pointer-events:none}.scene.on{opacity:1}
.lens{position:absolute;top:22px;right:28px;z-index:5;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 8px 24px #20344D14;font-size:13px;color:var(--mut)}
.lens .seg{margin:0;background:var(--sub)}
.lens .seg button{padding:7px 12px}
.stage{transition:background .4s}
.stage.aud{background:#FCEFF4}
.lensNote{position:absolute;top:74px;right:28px;z-index:5;max-width:300px;font-size:12.5px;line-height:1.4;color:var(--wine);background:#fff;border:1px solid #F4C6D7;border-radius:10px;padding:7px 11px;opacity:0;transform:translateY(-4px);transition:.3s;pointer-events:none}
.stage.aud .lensNote{opacity:1;transform:none}
.stage.aud .lensNote.same{color:var(--mut);border-color:var(--line)}
.lens.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 7px #E2236633}}
.steps{position:relative;z-index:2;margin-top:-100vh;padding-bottom:40vh;pointer-events:none}.steps .card{pointer-events:auto}
.step{min-height:100vh;display:flex;align-items:center;padding:0 0 0 6vw}
.card{max-width:390px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px 20px;font-size:16px;line-height:1.6;color:#33475F;opacity:.35;transform:translateY(12px);transition:opacity .45s,transform .45s;box-shadow:0 18px 44px #20344D14}
.step.on .card{opacity:1;transform:none}
.card p{margin:0 0 .7em}.card p:last-child{margin:0}
.card h3{font-size:24px;line-height:1.15;margin:6px 0 10px;color:var(--ink)}
.tag{font:500 11px 'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;color:var(--cr);text-transform:uppercase}
.card strong{color:var(--ink)}
.chap .card{background:none;border:0;box-shadow:none;max-width:560px;padding:0}
.chap .num{font-family:Sora,Inter,system-ui,sans-serif;font-size:120px;font-weight:700;line-height:.9;background:linear-gradient(135deg,var(--cr),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.chap h2{font-size:clamp(36px,4vw,52px);line-height:1.02;margin:10px 0 12px}
.chap p{font-size:19px;color:var(--mut);max-width:440px}
.card details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.card summary{cursor:pointer;font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:.06em;color:var(--wine);list-style:none;display:flex;gap:6px;align-items:center}
.card summary::-webkit-details-marker{display:none}
.card summary::before{content:"+";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--soft);font-size:12px;transition:transform .2s}
.card details[open] summary::before{transform:rotate(45deg)}
.card details p{font-size:14px;line-height:1.55;color:var(--mut);margin:8px 0 0}
.try{display:inline-flex;gap:6px;align-items:center;margin-top:6px;font:500 12px 'Geist Mono',ui-monospace,monospace;color:var(--wine);background:var(--soft);padding:6px 10px;border-radius:999px}

#g text{font-family:Inter,sans-serif}
#g .lb{font-size:14px;fill:var(--mut)}
#g .lbB{font-size:16px;font-weight:600;fill:var(--ink)}
#g .mn{font-family:'Geist Mono',ui-monospace,monospace,monospace;font-size:13px;fill:var(--ink)}
#g .mnS{font-family:'Geist Mono',ui-monospace,monospace,monospace;font-size:11px;letter-spacing:.14em;fill:var(--mut)}
#g .big{font-family:Sora,sans-serif;font-size:28px;font-weight:600;fill:var(--ink);letter-spacing:-.02em}
#g .sens .m,#g .sens .r{transition:opacity .4s}
#g .sens .r{opacity:0}
.stage.aud #g .sens .m{opacity:0}.stage.aud #g .sens .r{opacity:1}
#g .audOnly{opacity:0;transition:opacity .4s}.stage.aud #g .audOnly{opacity:1}
#g .pubOnly{transition:opacity .4s}.stage.aud #g .pubOnly{opacity:0}

/* INTERACTIVE BLOCKS */
.block{max-width:1120px;margin:0 auto;padding:12vh 24px}
.block .head{max-width:700px;margin-bottom:34px}
.block .head p{font-size:18px;line-height:1.6;color:var(--mut);margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 64px #20344D12;padding:28px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 14px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:.18s;display:inline-flex;gap:8px;align-items:center}
.pill:hover{border-color:var(--mut)}
.pill[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill small{font:400 12px 'Geist Mono',ui-monospace,monospace;opacity:.7}
.lbl{font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.who{display:grid;grid-template-columns:300px 1fr;gap:28px}
.who .obs{display:grid;gap:8px}
.who .obs .pill{justify-content:flex-start;border-radius:12px;padding:12px 14px;width:100%}
.obsIcon{width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--cr);flex:none}
.pill[aria-pressed=true] .obsIcon{background:#ffffff22;color:#fff}
.obsIcon svg{width:17px;height:17px}
.see{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.see > div{border-radius:16px;padding:18px 20px;min-height:180px}
.see .yes{background:#F3FBEA;border:1px solid #DDF3C4}.see .no{background:var(--sub);border:1px solid var(--line)}
.see h5{margin:0 0 10px;font:600 13px Inter,system-ui,sans-serif;display:flex;gap:8px;align-items:center}
.see .yes h5{color:var(--okd)}.see .no h5{color:var(--mut)}
.see ul{margin:0;padding:0;list-style:none;display:grid;gap:9px;font-size:15.5px;line-height:1.45}
.see li{display:flex;gap:10px;animation:in .35s both}
.see li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:8px;background:currentColor;opacity:.6}
.see .yes li{color:#2f4a18}.see .no li{color:var(--mut)}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.whoTitle{font-family:Sora,Inter,system-ui,sans-serif;font-size:22px;margin:4px 0 0;letter-spacing:-.025em}
.whoSub{color:var(--mut);font-size:15px;margin:6px 0 0}

.sim{display:grid;grid-template-columns:360px 1fr;gap:28px}
.sim .ctl{display:grid;gap:22px;align-content:start}
.amt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.amt span{font:500 14px 'Geist Mono',ui-monospace,monospace;color:var(--mut)}
.amt input{flex:1;border:0;font:500 20px 'Geist Mono',ui-monospace,monospace;color:var(--ink);width:100px;outline:none;background:transparent}
.conv{font-size:13.5px;color:var(--mut);margin-top:8px}
.conv.warn{color:var(--err)}
.go{border:0;background:var(--action,#C21852);color:#fff;font:600 15px Inter,system-ui,sans-serif;border-radius:10px;padding:14px 18px;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;gap:8px}
.go:hover{background:#B4184D}.go:disabled{background:#E3E8EF;color:var(--mut);cursor:not-allowed}
.out{display:grid;gap:18px}
.states{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{font:500 12.5px 'Geist Mono',ui-monospace,monospace;padding:7px 10px;border-radius:8px;background:var(--sub);color:#9AA7B7;border:1px solid var(--line);transition:.3s}
.st.done{background:#F3FBEA;color:var(--okd);border-color:#DDF3C4}
.st.now{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 4px #20344D1F}
.st.bad{background:#FDECEA;color:#8A2A20;border-color:#F6C9C3}
.arrow{color:#B9C4D2;font-size:12px}
.explorer{background:var(--ink);color:#DDE6F1;border-radius:16px;padding:16px 18px;font:13px/1.6 'Geist Mono',ui-monospace,monospace,monospace;min-height:200px}
.explorer .hd{display:flex;justify-content:space-between;color:#8FA3BC;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.explorer .hd b{color:var(--oks);font-weight:500;letter-spacing:0;text-transform:none;font-size:13px}
.explorer .ln{animation:in .35s both;padding:3px 0;border-bottom:1px dashed #33496A}
.explorer .ln i{font-style:normal;color:#FF8FB2}
.explorer .empty{color:#6E83A0}
.result{border-radius:14px;padding:16px 18px;font-size:15.5px;line-height:1.55;background:var(--sub);border:1px solid var(--line);min-height:58px}
.result.ok{background:#F3FBEA;border-color:#DDF3C4;color:#2f4a18}
.result.bad{background:#FDECEA;border-color:#F6C9C3;color:#7a261d}
.result b{font-family:'Geist Mono',ui-monospace,monospace;font-weight:500}

.limits{display:grid;gap:10px}
.lim{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.lim button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;gap:14px;align-items:center;padding:18px 20px;font:600 16.5px Inter,system-ui,sans-serif;color:var(--ink)}
.lim button span.n{font:500 12px 'Geist Mono',ui-monospace,monospace;color:var(--cr);width:24px}
.lim button i{margin-left:auto;font-style:normal;color:var(--mut);transition:transform .25s}
.lim.open button i{transform:rotate(45deg)}
.lim .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.lim.open .body{grid-template-rows:1fr}
.lim .body > div{overflow:hidden;padding:0 20px 0 58px;color:var(--mut);font-size:15.5px;line-height:1.6}
.lim.open .body > div{padding-bottom:18px}
.lim .fix{display:inline-block;margin-top:6px;font:500 12px 'Geist Mono',ui-monospace,monospace;color:var(--info);background:#E5F5FB;padding:4px 8px;border-radius:6px}

.final{background:var(--ink);color:#DDE6F1;padding:0 6vw;min-height:46vh;display:flex;align-items:center;position:relative;overflow:hidden}
.finIn{position:relative;z-index:1;max-width:1100px}
.finBrand{color:#fff;margin-bottom:22px}.finBrand span{color:#B7C5D8}
.final .facts{margin:30px 0 4px}
.final .links{margin-top:0;position:relative;z-index:1}
.final h2{color:#fff;font-size:clamp(34px,4vw,54px);margin:0 0 18px;max-width:820px;line-height:1.05}
.final p{max-width:680px;font-size:18px;line-height:1.65;color:#B7C5D8}
.final .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.final .links a{color:#fff;text-decoration:none;border:1px solid #ffffff33;border-radius:10px;padding:11px 16px;font:500 14px Inter,system-ui,sans-serif}
.final .links a.pri{background:var(--cr);border-color:var(--cr)}
.final .warn{margin-top:30px;font:500 13.5px Inter,system-ui,sans-serif;color:var(--ap)}
.final .iso{position:absolute;right:-60px;bottom:-80px;height:440px;fill:#ffffff0d;pointer-events:none}
.final .warn{max-width:760px;line-height:1.7}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1100px;margin-top:8px}
.facts div{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:14px;padding:18px 20px;font-size:15px;line-height:1.55;color:#C9D5E4}
.facts b{display:block;font:500 12px 'Geist Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ap);margin-bottom:8px}
.facts a{color:#fff}
@media (max-width:980px){.facts{grid-template-columns:1fr}}
.proof{max-width:760px;display:grid;gap:8px}
.proof a{display:flex;align-items:center;gap:14px;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:12px;padding:12px 16px;color:#fff;text-decoration:none;font-size:15px;transition:.2s}
.proof a:hover{background:#ffffff1a}
.proof a span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--cr);font:600 12px Inter,system-ui,sans-serif;flex:none}
.proof a code{margin-left:auto;background:#ffffff14;color:var(--ap)}
.foot{font-size:13px;color:#8FA3BC;margin-top:34px;max-width:760px;line-height:1.6}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;padding:6vh 20px 10vh}
  .mesh{min-height:auto;padding:26px 16px}
  .hint{display:none}
  .stage{height:100svh}
  .gwrap{left:8px;right:8px;top:58px;bottom:auto;height:min(calc((100vw - 16px) * .75),52svh)}
  .lens{top:10px;right:50%;transform:translateX(50%);padding:4px 4px 4px 10px;font-size:12px;white-space:nowrap}
  .lens .seg button{padding:6px 9px;font-size:12px}
  .lensNote{top:50px;right:50%;transform:translateX(50%)!important;max-width:92vw;white-space:nowrap;font-size:11.5px;padding:4px 9px}
  .steps{margin-top:-100svh}
  .step{min-height:100svh;padding:0 12px;align-items:flex-end;padding-bottom:12px}
  .card{max-width:none;width:100%;font-size:15px;line-height:1.5;padding:14px 16px;max-height:calc(100svh - min(75vw,52svh) - 84px);overflow-y:auto;opacity:0;box-shadow:0 -6px 30px #20344D1A}
  .step.on .card{opacity:1}
  .card h3{font-size:19px;margin:4px 0 6px}
  .card p{margin:0 0 .5em}
  .chap .card{background:#fff;padding:16px;border-radius:16px;border:1px solid var(--line)}
  .chap .num{font-size:56px}
  .chap h2{font-size:30px}
  .chap p{font-size:16px}

const STEPS={
es:[
 ['El problema · 1 de 2','Stellar es una vidriera',['En Stellar, un pago común queda a la vista de todos: quién, a quién, cuánto y cuándo.','Si María cambia su dinero por dólares digitales, estos llegan <strong>a su propia cuenta</strong>. Desde ahí, cualquiera puede seguirle el rastro.'],'','La casa de cambio es, técnicamente, una “rampa” (estándar SEP-24) que paga USDC a la dirección del usuario, con monto y hora. Esa dirección se puede seguir cuando entra al pool privado y cuando sale, en cualquier explorador como stellar.expert.'],
 ['El problema · 2 de 2','La caja fuerte necesita un portero',['Stellar ya tiene una caja fuerte compartida donde los saldos son secretos, pero solo pueden entrar personas verificadas.','Alguien tiene que verificar a cada persona, llevar la <strong>lista de invitados</strong> y darle acceso al auditor. Hoy, cada app tendría que hacerlo por su cuenta.'],'','La caja fuerte es el pool de <strong>Stellar Private Payments</strong>, de Nethermind, todavía en versión preliminar. La lista de invitados la maneja un ASP (<em>Association Set Provider</em>), y el auditor tiene la Global View Key del pool.'],
 ['La solución','Shield, el intermediario de confianza',['Shield recibe el dinero, lo guarda en la caja fuerte y se lo pasa a María en privado.','El público no ve la cuenta de María. Un auditor autorizado sí puede revisarlo todo.'],'','Shield es el ASP del pool y recibe los pagos en su cuenta ómnibus. No escribió ni modificó la caja fuerte: usa Stellar Private Payments tal como se publicó (<code>sdk-v0.2.1</code>). Se conecta con cualquier rampa compatible con SEP-1, SEP-10 y SEP-24.'],
 ['Paso 1 de 4','María se registra una vez',['María se registra con su billetera digital, la app donde guarda sus dólares. La <strong>llave para mover su dinero queda en su teléfono o computadora</strong>.','Shield verifica su identidad y la suma a la lista de invitados.'],'','Las claves del pool se derivan de una firma de Freighter. A Shield solo le llegan la clave pública y la "hoja" de la lista de permitidos, firmadas por la cuenta (SEP-53). La lista es un árbol de Merkle en un contrato: cada movimiento exige probar que la clave está ahí y que no está en la lista de bloqueo.'],
 ['Paso 2 de 4','Paga con tarjeta',['María pide cargar US$ 10 y paga con tarjeta, como en cualquier web.','El detalle clave: la casa de cambio manda los dólares <strong>a Shield</strong>, no a la cuenta de María.'],'','El pedido lleva firma SEP-53 y un <code>request_id</code> de un solo uso. Shield abre el depósito con SEP-10 y SEP-24 hacia su cuenta ómnibus, con un memo aleatorio. La rampa convierte el dinero a USDC.'],
 ['Paso 3 de 4','El dinero pasa por Shield',['Los dólares llegan a Shield, y Shield los guarda en la caja fuerte.','En el registro público solo se ve “casa de cambio → Shield → caja fuerte”. La cuenta de María <strong>no aparece ni una vez</strong>.'],'','Shield solo da un pago por bueno si la rampa confirma esa misma transacción, así que alguien que copie el memo no puede apropiarse del depósito. El depósito al pool tiene <code>ext_amount &gt; 0</code>, y el hash se guarda antes de enviarlo para no pagar nunca dos veces.'],
 ['Paso 4 de 4','Llega a María, en privado',['Dentro de la caja fuerte, Shield le pasa el dinero a María. El público no ve cuánto ni a quién.','La red comprueba que el pago es válido <strong>sin ver los números</strong>.'],'↗ Tocá “Auditor” arriba para ver lo que ve el auditor','Es una transferencia con <code>ext_amount = 0</code> y una prueba de conocimiento cero Groth16 (BN254), que el contrato verifica.'],
 ['Resultado','Saldo privado en 60 segundos',['Así funcionó en una prueba real en Stellar.','El público no ve el saldo. El auditor sí puede verlo, pero no moverlo.'],'','Corrida real en testnet del 26/10/2026: completada 60 s después del pedido y 40 s después del pago de la rampa, sin pasos manuales. Los montos de esta nota son ilustrativos.']],
en:[
 ['The problem · 1 of 2','Stellar is a shop window',['On Stellar, a regular payment is visible to everyone: who, to whom, how much and when.','If María exchanges her money for digital dollars, they land <strong>in her own account</strong>. From there, anyone can follow her trail.'],'','Technically, the exchange is an “on-ramp” (SEP-24 standard) that pays USDC to the user’s address, with amount and time. That address can be followed into the private pool and back out, in any explorer such as stellar.expert.'],
 ['The problem · 2 of 2','The vault needs a doorman',['Stellar already has a shared vault where balances are secret, but only verified people can get in.','Someone has to verify each person, keep the <strong>guest list</strong> and give the auditor access. Today, every app would have to do that on its own.'],'','The vault is the <strong>Stellar Private Payments</strong> pool, by Nethermind, still a developer preview. The guest list is run by an ASP (<em>Association Set Provider</em>), and the auditor holds the pool’s Global View Key.'],
 ['The solution','Shield, the trusted intermediary',['Shield receives the money, puts it in the vault and passes it to María privately.','The public doesn’t see María’s account. An authorized auditor can still review everything.'],'','Shield is the pool’s ASP and receives payments on its omnibus account. It didn’t write or modify the vault: it uses Stellar Private Payments as published (<code>sdk-v0.2.1</code>). It works with any on-ramp that supports SEP-1, SEP-10 and SEP-24.'],
 ['Step 1 of 4','María signs up once',['María signs up with her digital wallet, the app where she keeps her dollars. The <strong>key that moves her money stays on her phone or computer</strong>.','Shield verifies her identity and adds her to the guest list.'],'','The pool keys are derived from a Freighter signature. Shield only receives the public key and the allow-list “leaf”, signed by the account (SEP-53). The list is a Merkle tree in a contract: every move must prove the key is on it and not on the blocklist.'],
 ['Step 2 of 4','She pays by card',['María asks to add US$ 10 and pays by card, like on any website.','The key detail: the exchange sends the dollars <strong>to Shield</strong>, not to María’s account.'],'','The request carries a SEP-53 signature and a single-use <code>request_id</code>. Shield opens the deposit through SEP-10 and SEP-24 to its omnibus account, with a random memo. The on-ramp converts the money to USDC.'],
 ['Step 3 of 4','The money goes through Shield',['The dollars reach Shield, and Shield puts them in the vault.','The public record only shows “exchange → Shield → vault”. María’s account <strong>doesn’t appear at all</strong>.'],'','Shield only accepts a payment if the on-ramp confirms that exact transaction, so someone copying the memo can’t claim the deposit. The pool deposit has <code>ext_amount &gt; 0</code>, and its hash is saved before sending, so it is never paid twice.'],
 ['Step 4 of 4','It reaches María, privately',['Inside the vault, Shield passes the money to María. The public can’t see how much or to whom.','The network checks that the payment is valid <strong>without seeing the numbers</strong>.'],'↗ Tap “Auditor” above to see what the auditor sees','It’s a transfer with <code>ext_amount = 0</code> and a Groth16 zero-knowledge proof (BN254) that the contract verifies.'],
 ['Result','A private balance in 60 seconds',['That’s how it went in a real test on Stellar.','The public can’t see the balance. The auditor can see it, but can’t move it.'],'','Real testnet run on 2026-10-26: completed 60 s after the request and 40 s after the on-ramp’s payment, with no manual steps. Amounts in this explainer are illustrative.']],
pt:[
 ['O problema · 1 de 2','A Stellar é uma vitrine',['Na Stellar, um pagamento comum fica à vista de todos: quem, para quem, quanto e quando.','Se a María troca o dinheiro por dólares digitais, eles chegam <strong>na conta dela</strong>. A partir daí, qualquer pessoa pode seguir o rastro.'],'','Tecnicamente, a casa de câmbio é uma “rampa” (padrão SEP-24) que paga USDC no endereço do usuário, com valor e horário. Esse endereço pode ser seguido quando entra no pool privado e quando sai, em qualquer explorador como o stellar.expert.'],
 ['O problema · 2 de 2','O cofre precisa de um porteiro',['A Stellar já tem um cofre compartilhado onde os saldos são secretos, mas só entram pessoas verificadas.','Alguém precisa verificar cada pessoa, manter a <strong>lista de convidados</strong> e dar acesso ao auditor. Hoje, cada app teria que fazer isso sozinho.'],'','O cofre é o pool do <strong>Stellar Private Payments</strong>, da Nethermind, ainda em versão preliminar. A lista de convidados é mantida por um ASP (<em>Association Set Provider</em>), e o auditor tem a Global View Key do pool.'],
 ['A solução','Shield, o intermediário de confiança',['O Shield recebe o dinheiro, guarda no cofre e repassa para a María com privacidade.','O público não vê a conta da María. Um auditor autorizado pode revisar tudo.'],'','O Shield é o ASP do pool e recebe os pagamentos na sua conta ômnibus. Ele não escreveu nem modificou o cofre: usa o Stellar Private Payments como foi publicado (<code>sdk-v0.2.1</code>). Funciona com qualquer rampa compatível com SEP-1, SEP-10 e SEP-24.'],
 ['Passo 1 de 4','María se cadastra uma vez',['María se cadastra com a carteira digital, o app onde guarda seus dólares. A <strong>chave que movimenta o dinheiro fica no celular ou computador dela</strong>.','O Shield verifica a identidade dela e a inclui na lista de convidados.'],'','As chaves do pool são derivadas de uma assinatura da Freighter. O Shield só recebe a chave pública e a “folha” da lista de permitidos, assinadas pela conta (SEP-53). A lista é uma árvore de Merkle em um contrato: cada movimentação precisa provar que a chave está nela e que não está na lista de bloqueio.'],

// LENS
const stage=document.getElementById('stage'),lensEl=document.getElementById('lens');
function setLens(v){setTimeout(()=>typeof lensNote==='function'&&lensNote());stage.classList.toggle('aud',v==='aud');lensEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
lensEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{setLens(b.dataset.v);lensEl.classList.remove('pulse')});

// HERO toggle
const hp=document.getElementById('heroPay');let heroManual=false;
function heroSet(v){hp.classList.toggle('aud',v==='aud');hp.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));heroNoteSet()}
hp.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{heroManual=true;heroSet(b.dataset.v)});
let hv='pub';const heroNoteSet=()=>document.getElementById('heroNote').textContent=hp.classList.contains('aud')?UI[L].heroAud:UI[L].heroPub;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(heroManual)return;hv=hv==='pub'?'aud':'pub';heroSet(hv)},3600);

// SCROLL
let steps=[];let cur=null;
function restart(g){g.querySelectorAll('[begin="indefinite"]').forEach(a=>{try{a.endElement&&a.endElement();a.beginElementAt(parseFloat(a.dataset.d||0))}catch(e){}})}
function show(name){if(name===cur)return;cur=name;document.querySelectorAll('.scene').forEach(g=>g.classList.toggle('on',g.id==='s-'+name));const g=document.getElementById('s-'+name);if(g)restart(g);lensNote()}
function lensNote(){const g=document.getElementById('s-'+cur),n=document.getElementById('lensNote');const diff=g&&g.querySelector('.sens,.audOnly');n.classList.toggle('same',!diff);n.textContent=diff?UI[L].lensDiff:UI[L].lensSame}
function activate(st){steps.forEach(s=>s.classList.toggle('on',s===st));show(st.dataset.scene);if(st.dataset.lensHint&&!lensEl.dataset.hinted){lensEl.dataset.hinted=1;lensEl.classList.add('pulse')}}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)activate(e.target)}),{rootMargin:'-48% 0px -48% 0px'});
function renderSteps(){const el=document.getElementById('steps');el.innerHTML=STEPS[L].map((st,i)=>{const[tag,h,body,extra,c]=st;return `<div class="step" data-scene="${SCENES[i]}"${SCENES[i]==='transfer'?' data-lens-hint="1"':''}><div class="card"><div class="tag">${tag}</div><h3>${h}</h3>${body.map(p=>`<p>${p}</p>`).join('')}${extra?`<span class="try">${extra}</span>`:''}${c?`<details><summary>${UI[L].cur}</summary><p>${c}</p></details>`:''}</div></div>`}).join('');
 io.disconnect();steps=[...el.querySelectorAll('.step')];steps.forEach(s=>io.observe(s))}
renderSteps();show('leak');
addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('progress').style.width=(h.scrollTop/(h.scrollHeight-innerHeight)*100)+'%'},{passive:true});

// WHO SEES WHAT
const OBS_ES=[{id:'pub',n:'El público',d:'cualquiera que mire el registro',ic:'i-eye'},{id:'anchor',n:'La casa de cambio',d:'cambia tu dinero por dólares digitales',ic:'i-bank'},{id:'shield',n:'Shield',d:'el intermediario',ic:'iso'},{id:'aud',n:'El auditor',d:'puede mirar, no puede tocar',ic:'i-key'},{id:'other',n:'Otro usuario',d:'alguien más en la caja fuerte',ic:'i-users'}];
const SEE_ES={ramp:{

 anchor:[['Quién es María (le verificó la identidad)','Cuánto pagó'],['Qué pasa dentro de la caja fuerte','Adónde fue a parar el dinero']],
 shield:[['Quién es quién dentro de la caja fuerte (lleva la lista de invitados)','Cada pedido de carga: quién, cuánto y cuándo'],['La llave de María para mover su dinero: queda en su dispositivo']],
 aud:[['Cada saldo y cada movimiento de la caja fuerte: de quién y cuánto'],['Nada. Ese es el trato: la caja fuerte tiene controles']],
 other:[['Nada sobre los demás'],['Saldos ajenos','Movimientos ajenos']]},
 direct:{

 anchor:[['Nada: en este caso no participa'],['Todo el recorrido']],
 shield:[['Quién es quién dentro de la caja fuerte'],['La llave de María para mover su dinero']],
 aud:[['Cada saldo y cada movimiento: de quién y cuánto'],['Nada']],
 other:[['Nada sobre los demás'],['Saldos ajenos','Movimientos ajenos']]}};
let mode='ramp',obs='pub';
let OBS=OBS_ES,SEE=SEE_ES;
function setWhoLang(){if(L==='es'){OBS=OBS_ES;SEE=SEE_ES}else{OBS=OBS_ES.map((o,i)=>({...o,n:OBS_T[L][i][0],d:OBS_T[L][i][1]}));SEE=SEE_T[L]}}
setWhoLang();
const op=document.getElementById('obsPills');
function buildObs(){op.innerHTML=OBS.map(o=>`<button class="pill" data-o="${o.id}" aria-pressed="${o.id===obs}"><span class="obsIcon"><svg viewBox="${o.ic==='iso'?'0 0 272 394':'0 0 24 24'}"${o.ic==='iso'?' fill="currentColor"':''}><use href="#${o.ic}"/></svg></span><span style="text-align:left"><b style="font-weight:600;display:block">${o.n}</b><small style="font-family:Inter,system-ui,sans-serif;opacity:.75">${o.d}</small></span></button>`).join('');
 op.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{obs=b.dataset.o;renderWho()})}
buildObs();
function renderWho(){const o=OBS.find(x=>x.id===obs),[y,n]=SEE[mode][obs];
 document.getElementById('whoTitle').textContent=o.n;
 document.getElementById('whoSub').textContent=mode==='ramp'?UI[L].whoRamp:UI[L].whoDirect;
 document.getElementById('seeYes').innerHTML=y.map((x,i)=>`<li style="animation-delay:${i*60}ms">${x}</li>`).join('');
 document.getElementById('seeNo').innerHTML=n.map((x,i)=>`<li style="animation-delay:${i*60}ms">${x}</li>`).join('');
 op.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.o===obs));
 document.querySelectorAll('#modePills .pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode))}
op.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{obs=b.dataset.o;renderWho()});
document.querySelectorAll('#modePills .pill').forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderWho()});
renderWho();


function setLang(l,save){L=l;const u=UI[L];document.documentElement.lang=L;document.title=u.title;
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=u[e.dataset.i]);
 document.querySelectorAll('[data-a]').forEach(e=>e.setAttribute('aria-label',u[e.dataset.a]));
 document.querySelectorAll('[data-app]').forEach(a=>a.href=BASE+APP[L]+a.dataset.app);
 document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
 const prev=cur;buildScenes();renderSteps();cur=null;show(prev||'leak');
 const on=steps.find(x=>x.dataset.scene===prev);if(on)on.classList.add('on');
 setWhoLang();buildObs();renderWho();heroNoteSet();
 if(save){try{localStorage.setItem('shield-lang',L)}catch(e){}}}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.l,true));
setLang(L);
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('svg').forEach(s=>s.pauseAnimations&&s.pauseAnimations());
</script>
